# ============================================================
# Cribl Cardinality Reduction Pack v4.0.0 — Splunk Saved Searches
# ============================================================
# Install:
#   1. Copy to $SPLUNK_HOME/etc/apps/search/local/savedsearches.conf
#      OR create an app dir and copy there
#   2. Restart Splunk (or `splunk reload savedsearches`)
#
# IMPORTANT — what these searches can and cannot see:
#
#   All cr_* audit fields are EVENT fields written into the events that
#   arrive at your destination. They are NOT metrics — there is nothing to
#   `mstats` here; every search below is a plain event search (index=...).
#
#   Field availability at the destination:
#     - cr_risk, cr_route_tier .......... ALWAYS emitted (every event,
#                                          unless OMIT_NONE_TAGS suppresses
#                                          none-risk tags)
#     - cr_would_modify, cr_would_drop,
#       cr_would_normalize_metric ........ only while DRY_RUN=true
#     - cr_match_count, cr_categories,
#       cr_fields_modified,
#       cr_whitelisted ................... only while DRY_RUN=true OR
#                                          VERBOSE_AUDIT_METADATA=true
#     - cr_pack_version, cr_dest_type,
#       cr_raw_bytes_saved, cr_otel_* .... only while VERBOSE_AUDIT_METADATA=true
#     - cr_error*, cr_config_invalid,
#       cr_dest_type_unknown,
#       cr_mode_unknown,
#       cr_thresholds_inverted,
#       cr_walk_truncated ................ emitted whenever the condition occurs
#
#   If a search returns nothing, first check that DRY_RUN or
#   VERBOSE_AUDIT_METADATA is enabled on the pack — most audit fields are
#   intentionally absent in quiet production mode.
#
#   Note on cr_risk semantics: risk tiers come from heuristic category
#   weights (session/email/jwt/ip weigh heaviest; uuid/mac/hex/timestamps
#   next; container/url lower). They are NOT measured time-series counts.
#
# Adjust `index=*` filters to match your environment.
# ============================================================

[CRP - Audit Overview: Events by Risk]
search = index=* cr_risk=* earliest=-24h \
| stats count by cr_risk \
| eval sort_key = case(cr_risk=="critical",0, cr_risk=="high",1, cr_risk=="medium",2, cr_risk=="none",3, true(),4) \
| sort sort_key \
| fields - sort_key
description = Events by heuristic cardinality risk tier (last 24h). cr_risk is always emitted (unless OMIT_NONE_TAGS suppresses none-risk tags). Tiers reflect category weights, not measured series counts.
dispatch.earliest_time = -24h
dispatch.latest_time = now

[CRP - Routing Tier Distribution]
search = index=* cr_route_tier=* earliest=-24h \
| stats count by cr_route_tier \
| eval cost_tier = case(cr_route_tier=="hot", "$$$$", cr_route_tier=="warm", "$$", cr_route_tier=="cold", "$") \
| sort -count
description = Events by storage routing tier with cost indicator. cr_route_tier is always emitted.
dispatch.earliest_time = -24h
dispatch.latest_time = now

[CRP - Top Fields the Pack Would Normalize (DRY_RUN)]
search = index=* cr_would_modify=* cr_would_modify!="none" earliest=-24h \
| makemv delim="," cr_would_modify \
| mvexpand cr_would_modify \
| stats count by cr_would_modify \
| rename cr_would_modify as field_path \
| sort -count \
| head 20
description = Field paths most frequently flagged for normalization. Requires DRY_RUN=true. Use to identify FIELD_WHITELIST candidates before flipping DRY_RUN=false.
dispatch.earliest_time = -24h
dispatch.latest_time = now

[CRP - Pattern Category Breakdown]
search = index=* cr_categories=* cr_categories!="none" earliest=-24h \
| makemv delim="," cr_categories \
| mvexpand cr_categories \
| stats count by cr_categories \
| rename cr_categories as category \
| sort -count
description = Distribution of detected cardinality patterns (uuid / session_id / container_hash / ...). Requires DRY_RUN=true or VERBOSE_AUDIT_METADATA=true.
dispatch.earliest_time = -24h
dispatch.latest_time = now

# ------------------------------------------------------------
# FLAGSHIP: Cardinality Savings Report
#
# CAVEAT — these numbers are ESTIMATES, by design. A true series/value
# reduction count would require dc() over the actual high-cardinality
# values the pack would have rewritten. That is impossible post-hoc from
# the audit fields alone: cr_categories tells you WHICH pattern matched
# and cr_would_modify tells you WHERE, but the raw values themselves are
# spread across arbitrary field paths that SPL cannot dc() dynamically.
# We therefore estimate impact from event counts per category, banded by
# the engine's heuristic risk weights. Treat the report as directional:
# it shows where normalization will bite, not an exact series count.
# ------------------------------------------------------------
[CRP - Cardinality Savings Report]
search = index=* cr_categories=* cr_categories!="none" earliest=-24h \
| eventstats count as flagged_events_total \
| makemv delim="," cr_categories \
| mvexpand cr_categories \
| eval risk_band = case( \
    match(cr_categories, "session|email|jwt|^ip"), "1 - critical-ish", \
    match(cr_categories, "uuid|mac|hex|timestamp"), "2 - high-ish", \
    true(), "3 - medium-ish") \
| stats count as flagged_events, max(flagged_events_total) as flagged_events_total by cr_categories, risk_band \
| eval pct_of_flagged = round(flagged_events * 100 / flagged_events_total, 1) \
| eval est_impact = case( \
    risk_band=="1 - critical-ish", "near-unbounded values; largest series/value savings when normalized", \
    risk_band=="2 - high-ish",     "high-churn identifiers; substantial savings", \
    true(),                        "moderate-churn values; incremental savings") \
| sort risk_band, -flagged_events \
| rename cr_categories as category, flagged_events as "events flagged", pct_of_flagged as "% of all flagged events", est_impact as "estimated impact (heuristic)" \
| fields - flagged_events_total
description = ESTIMATED cardinality savings by pattern category — the one-page report to screenshot for stakeholders. Event counts per category, banded by the engine's heuristic risk weights (session/email/jwt/ip heaviest). NOT a measured series count: exact dc() of would-be-modified values is impossible post-hoc (see comment above). Requires DRY_RUN=true or VERBOSE_AUDIT_METADATA=true.
dispatch.earliest_time = -24h
dispatch.latest_time = now

[CRP - DRY_RUN Impact Summary]
search = index=* cr_would_modify=* earliest=-24h \
| stats count as audited_events, \
        count(eval(cr_would_modify!="none")) as would_reduce, \
        dc(cr_would_modify) as unique_modify_signatures \
| eval impact_pct = round(would_reduce * 100 / audited_events, 1)
description = DRY_RUN summary: how many audited events would be modified if you flipped DRY_RUN=false. Requires DRY_RUN=true. Run before activating live mode.
dispatch.earliest_time = -24h
dispatch.latest_time = now

[CRP - Whitelist Coverage]
search = index=* cr_whitelisted=* earliest=-24h \
| makemv delim="," cr_whitelisted \
| mvexpand cr_whitelisted \
| stats count by cr_whitelisted \
| rename cr_whitelisted as whitelisted_field \
| sort -count
description = Fields skipped because of FIELD_WHITELIST. Requires DRY_RUN=true or VERBOSE_AUDIT_METADATA=true. A spike means a new high-cardinality field is being protected — verify it should be.
dispatch.earliest_time = -24h
dispatch.latest_time = now

[CRP - Engine Errors]
search = index=* cr_error=* earliest=-24h \
| stats count by cr_error_stage, cr_error_type, cr_error \
| sort -count
description = Events where the engine caught an exception (cr_error / cr_error_stage / cr_error_type; cr_error_version and cr_error_stack carry extra detail). Should be ~0; spikes indicate malformed inputs or pack regressions.
dispatch.earliest_time = -24h
dispatch.latest_time = now

[CRP - Config Warnings]
search = index=* (cr_config_invalid=* OR cr_dest_type_unknown=* OR cr_mode_unknown=* OR cr_thresholds_inverted=* OR cr_walk_truncated=*) earliest=-24h \
| eval warning = case( \
    isnotnull(cr_config_invalid),     "config_invalid: "      . cr_config_invalid, \
    isnotnull(cr_dest_type_unknown),  "dest_type_unknown: "   . cr_dest_type_unknown, \
    isnotnull(cr_mode_unknown),       "mode_unknown: "        . cr_mode_unknown, \
    isnotnull(cr_thresholds_inverted),"thresholds_inverted: " . cr_thresholds_inverted, \
    isnotnull(cr_walk_truncated),     "walk_truncated (event too deep/wide)") \
| stats count by warning \
| sort -count
description = Pack configuration warnings tagged onto events: unrecognized DESTINATION_TYPE / MODE, invalid config, inverted thresholds, or events truncated by depth/width limits. Any sustained count means a pack variable needs fixing.
dispatch.earliest_time = -24h
dispatch.latest_time = now

[CRP - Critical Cardinality Alert]
search = index=* cr_risk=critical earliest=-1h \
| stats count as critical_events \
| where critical_events > 1000
description = ALERT: > 1000 events tagged critical in the last hour. cr_risk=critical is a heuristic tier (session/email/jwt/ip-class patterns), indicating a likely cardinality explosion entering the system.
dispatch.earliest_time = -1h
dispatch.latest_time = now
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
is_scheduled = 1
cron_schedule = 0 * * * *
