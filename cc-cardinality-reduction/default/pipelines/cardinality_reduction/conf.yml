id: cardinality_reduction
groups: {}
asyncFuncTimeout: 10000
output: default
description: >-
  Cardinality Reduction Pipeline v4.0.0 — Complete Cardinality Management

  Detects 25+ high-cardinality patterns in logs and metrics, audits in
  DRY_RUN, then normalizes / drops / aggregates when activated. Audit
  results are emitted as destination-visible cr_* fields (cr_risk,
  cr_route_tier, cr_would_modify) so the evaluate-then-activate loop can
  run from your destination's search UI.

  PIPELINE STAGES:
  1. Auto-Parser — JSON / Prometheus exposition extraction from _raw
  2. Code Engine — Two-pass detection, dry-run support, field whitelisting,
     risk classification, routing tags
  3. Histogram Optimization — Drop non-SLO Prometheus histogram buckets
  4. Counter Aggregation — Aggregate high-cardinality counters (sum + count)
  5. Gauge Aggregation — Aggregate high-cardinality gauges (avg + min + max)
  6. Internal-Field Strip — Remove inter-stage plumbing fields

functions:
  # ============================================================
  # STAGE 0: Auto-Parser (JSON + Prometheus exposition format)
  # ============================================================
  # Extracts structured fields from _raw when data arrives unparsed.
  # Handles: JSON objects in _raw → top-level fields
  #          Prometheus lines → _metric, labels{}, _value
  # Skip if _metric already exists (data is already structured).
  # ============================================================
  # Parses raw Prometheus metric lines into structured fields:
  #   metric_name{label="value",...} 12345 1678900000
  #   → _metric, labels{}, _value, _time
  # Fires on _raw lines that look like Prometheus exposition format
  # (starts with a word char, contains {, is not JSON).
  # Useful for any source that delivers Prometheus exposition lines as `_raw`.
  - id: code
    filter: "_raw && !_metric"
    disabled: false
    conf:
      maxNumOfIterations: 5000
      code: |-
        // Auto-parser: detects format and extracts structured fields from _raw.
        // After successful parsing, _raw is deleted because it's now redundant
        // — keeping both the raw line and the parsed structured fields would
        // double byte volume on the destination side. If your destination
        // requires _raw, disable this Code function or run it through a
        // post-pipeline that reconstructs _raw from the structured form.
        //
        // v4.0.0: STRICT Prometheus line-shape gate. The old fallback accepted
        // any "word number ..." line, so RFC3164 syslog ("Jan 15 10:33:01 host
        // sshd[123]: ...") parsed as _metric="Jan", _value=15, _time=10 — and
        // rewrote event timestamps to 1970 EVEN IN AUDIT MODE. Now: metric name
        // must be a valid Prometheus identifier, the value token must be fully
        // numeric (or +Inf/-Inf/NaN, preserved instead of coerced to 0), the
        // line must have exactly 2-3 tokens, and an existing _time is NEVER
        // overwritten — the parsed exposition timestamp only fills a missing one.
        const raw = __e._raw;
        if (raw && typeof raw === 'string') {

        const firstChar = raw.charAt(0);
        let parsedOk = false;

        // Prometheus identifier + sample-value shapes (anchored, full-token)
        const RE_PROM_NAME = /^[a-zA-Z_:][a-zA-Z0-9_:]*$/;
        const RE_PROM_VALUE = /^[+-]?(\d+(\.\d+)?([eE][+-]?\d+)?|\.\d+([eE][+-]?\d+)?|Inf|NaN)$/;
        const RE_PROM_TS = /^-?\d{10,13}(\.\d+)?$/;
        function promValue(tok) {
          if (tok === '+Inf' || tok === 'Inf') return Infinity;
          if (tok === '-Inf') return -Infinity;
          if (tok === 'NaN') return NaN;
          return parseFloat(tok);
        }
        function setPromTime(tok) {
          // Fill _time only when the event doesn't already have one — the
          // receiving source's timestamp wins over a parsed exposition ts.
          if (__e._time == null && tok && RE_PROM_TS.test(tok)) {
            __e._time = parseFloat(tok) / (tok.indexOf('.') < 0 && tok.length > 12 ? 1000 : 1);
          }
        }

        if (firstChar === '{') {
          // JSON: extract all keys as top-level event fields.
          // v4.0.0: never promote keys that could spoof engine/Cribl internals
          // (__-prefixed, cr_-prefixed) or pollute prototypes.
          try {
            const parsed = JSON.parse(raw);
            if (typeof parsed === 'object' && parsed !== null) {
              for (const [k, v] of Object.entries(parsed)) {
                if (k === '_raw' || k === '_time') continue;
                if (k === '__proto__' || k === 'constructor' || k === 'prototype') continue;
                if (k.startsWith('__') || k.startsWith('cr_')) continue;
                __e[k] = v;
              }
              parsedOk = true;
            }
          } catch (e) {
            // Cat-4.1: not valid JSON. Bump a counter so operators can spot
            // a pattern of malformed input from a specific source.
            if (typeof C.Metric === 'function') {
              try { C.Metric('cr_autoparse_skipped', 1, {reason: 'invalid_json'}); } catch (ignored) { /* */ }
            }
          }
        } else if (/^[a-zA-Z_:]/.test(raw)) {
          // Prometheus exposition format: metric_name{labels} value timestamp
          const braceStart = raw.indexOf('{');
          const braceEnd = raw.indexOf('}');

          if (braceStart > 0 && braceEnd > braceStart) {
            const name = raw.substring(0, braceStart);
            const labelStr = raw.substring(braceStart + 1, braceEnd);
            const afterBrace = raw.substring(braceEnd + 1).trim();
            const parts = afterBrace.split(/\s+/);
            if (RE_PROM_NAME.test(name) && parts.length >= 1 && parts.length <= 2 && RE_PROM_VALUE.test(parts[0])) {
              __e._metric = name;
              __e._value = promValue(parts[0]);
              setPromTime(parts[1]);
              __e.labels = {};
              const labelRe = /([a-zA-Z_][a-zA-Z0-9_]*)="([^"]*)"/g;
              let m;
              while ((m = labelRe.exec(labelStr)) !== null) {
                __e.labels[m[1]] = m[2];
              }
              parsedOk = true;
            }
          } else {
            // Bare form: exactly `name value [timestamp]` — 2 or 3 tokens, all
            // strictly shaped. Multi-token lines (syslog headers, free text)
            // fall through untouched.
            const parts = raw.trim().split(/\s+/);
            if ((parts.length === 2 || parts.length === 3) &&
                RE_PROM_NAME.test(parts[0]) && RE_PROM_VALUE.test(parts[1]) &&
                (parts.length === 2 || RE_PROM_TS.test(parts[2]))) {
              __e._metric = parts[0];
              __e._value = promValue(parts[1]);
              setPromTime(parts[2]);
              __e.labels = {};
              parsedOk = true;
            }
          }
        }

        // Drop _raw after successful parse — structured fields are the
        // canonical representation now and keeping _raw doubles bytes.
        // In DRY_RUN we leave _raw alone so the audit doesn't violate
        // the "see everything, change nothing" promise.
        // v3.20.0: delete _raw ONLY when DRY_RUN is an EXPLICIT live value, matching
        // stage-1's toBool() semantics. The old check treated only true/'true'/undefined
        // as audit, so DRY_RUN='1'/'yes'/'TRUE' (all audit-truthy in stage 1) would delete
        // _raw here — a live mutation during what the operator intended as audit.
        const _dr = C.vars.DRY_RUN;
        const _drStr = (typeof _dr === 'string') ? _dr.trim().toLowerCase() : _dr;
        const _isLive = (_dr === false || _dr === 0 ||
          _drStr === 'false' || _drStr === '0' || _drStr === 'no' || _drStr === 'off');
        if (parsedOk && _isLive) delete __e._raw;
        }
    description: "Auto-parse _raw: JSON → top-level fields, Prometheus exposition → _metric/labels/_value. Useful for sources that deliver raw lines without pre-parsing."

  # ============================================================
  # STAGE 1: Core Cardinality Reduction Engine
  # ============================================================
  - id: code
    filter: "true"
    disabled: false
    conf:
      maxNumOfIterations: 5000
      code: |-
        // ============================================================
        // CARDINALITY REDUCTION ENGINE v4.0.0
        // DataDay Technology Solutions
        // ============================================================
        //
        // v4.0.0 BREAKING: operator-facing audit fields renamed __cr_* → cr_*.
        // Cribl strips double-underscore internal fields before they reach
        // destinations, so the old names never appeared in Splunk/Elastic/etc.
        // Internal inter-stage plumbing (__cr_requires_aggregation,
        // __cr_metric_type, __keep_bucket) intentionally KEEPS the __ prefix —
        // those must never ship to a destination.
        //
        // PIPELINE STAGES AFTER THIS CODE FUNCTION:
        //   - Histogram bucket optimization (Lookup + Drop)
        //   - Metric aggregation (Aggregation functions)
        //
        // ============================================================

        // Cat-2.3 (corrected v3.17.1): Cribl's `code` function forbids `return`
        // at top level — earlier `return __e;` here caused "Line: Illegal return
        // statement" and prevented stage-1 from loading entirely. The downstream
        // code is already null-safe via per-block guards (`if (__e._raw && ...)`,
        // `Object.entries(...)`), and Cribl never actually delivers null events.

        // --- Fallback JSON parse if Parser function didn't extract fields ---
        // Stage 0 Parser handles this in the Cribl UI, but cribl pipe CLI
        // may not load Parser functions. This fallback ensures sample data works.
        if (__e._raw && !__e._metric && !__e.source && typeof __e._raw === 'string' && __e._raw.startsWith('{')) {
          try {
            const parsed = JSON.parse(__e._raw);
            for (const [k, v] of Object.entries(parsed)) {
              if (k === '_time' || k === '_raw' || k.startsWith('cribl_')) continue;
              if (k === '__proto__' || k === 'constructor' || k === 'prototype') continue;
              if (k.startsWith('__') || k.startsWith('cr_')) continue;
              __e[k] = v;
            }
          } catch(e) {}
        }

        // --- Configuration ---
        function toBool(v, def) {
          // Cat-2.4: accept the broader set of falsy/truthy strings users actually type.
          // v3.20.0: trim + lowercase strings first so 'false ' (trailing space, a real
          // copy-paste footgun) is recognized, and fall back to `def` for ANY unrecognized
          // value instead of `!!v`. The old `!!v` coerced 'maybe'/'disabled'/' false ' to
          // true, which could silently ENABLE a default-false destructive flag on a typo.
          if (v === true || v === 1) return true;
          if (v === false || v === 0) return false;
          if (typeof v === 'string') {
            const s = v.trim().toLowerCase();
            if (s === 'true' || s === '1' || s === 'yes' || s === 'on') return true;
            if (s === 'false' || s === '0' || s === 'no' || s === 'off') return false;
            return def; // unrecognized string -> documented default, never a silent enable
          }
          return def;
        }
        const modeRaw = (C.vars.MODE || 'safe').toLowerCase();
        // Cat-2.1: validate MODE — silent fallback to 'safe' is a footgun if user types
        // 'agressive' (typo) or 'aggressiv' — they'd think aggressive patterns are firing.
        const mode = (modeRaw === 'safe' || modeRaw === 'aggressive') ? modeRaw : 'safe';
        const modeUnknown = mode !== modeRaw;
        const destTypeRaw = (C.vars.DESTINATION_TYPE || 'splunk').toLowerCase();
        // v3.6.3: validate destination — silently treating an unknown value
        // as 'replace' was a footgun for users who typed 'elasticsearch' or
        // 'mimir'. Now we map known aliases and tag the event with
        // cr_dest_type_unknown=true if the value is unrecognized.
        const DEST_ALIASES = {
          splunk:'splunk', splunk_hec:'splunk', splunk_indexer:'splunk',
          prometheus:'prometheus', mimir:'prometheus', cortex:'prometheus', thanos:'prometheus',
          datadog:'datadog', dd:'datadog',
          chronicle:'chronicle', google_chronicle:'chronicle', secops:'chronicle',
          elastic:'elastic', elasticsearch:'elastic', opensearch:'elastic',
          loki:'loki', grafana_loki:'loki',
          s3:'object_storage', gcs:'object_storage', azure_blob:'object_storage', object_storage:'object_storage',
          custom:'custom',
        };
        const destType = DEST_ALIASES[destTypeRaw] || 'custom';
        const destTypeUnknown = !DEST_ALIASES[destTypeRaw];

        const normDefaultRaw = (C.vars.NORMALIZATION_DEFAULT || 'replace').toLowerCase();
        // Cat-2.7: validate NORMALIZATION_DEFAULT — silent fallback to 'replace' on typo
        const normDefault = (normDefaultRaw === 'replace' || normDefaultRaw === 'enrich') ? normDefaultRaw : 'replace';
        // DRY_RUN defaults to TRUE — pack ships in audit mode. If C.vars.DRY_RUN
        // is undefined (e.g. /preview API doesn't pass pack vars), the engine
        // still defaults to audit so users see cr_would_modify tags. Flip
        // DRY_RUN=false in pack settings to activate live normalization.
        const dryRun = toBool(C.vars.DRY_RUN, true);
        const enablePii = toBool(C.vars.ENABLE_PII_DETECTION, false);
        // Theme-1 (v3.18.0): per-event metric sampling. At 100k ev/s × 12 workers
        // the always-on metric path emits >1M C.Metric() calls/sec. Sample at 0.1
        // by default to keep aggregate metrics directionally accurate while
        // protecting the metrics destination from a hot-loop write storm.
        // Set 1 to disable sampling. Set 0 to disable metrics entirely.
        let metricsSampleRate = Number(C.vars.METRICS_SAMPLE_RATE);
        if (!Number.isFinite(metricsSampleRate) || metricsSampleRate < 0 || metricsSampleRate > 1) metricsSampleRate = 0.1;
        const _emitMetric = metricsSampleRate >= 1
          ? function () { return true; }
          : (metricsSampleRate <= 0 ? function () { return false; } : function () { return Math.random() < metricsSampleRate; });
        const enableUuid = toBool(C.vars.ENABLE_UUID_DETECTION, true);
        const enableOtel = toBool(C.vars.ENABLE_OTEL_NORMALIZATION, true);
        // v3.17.1: removed globalThis-based init-log (sandbox forbids globalThis).
        // Per-worker init tracking would need a different mechanism (e.g. C.attach()).
        // The pack's other observability signals (cr_events_processed{dest}, the
        // worker pipelineMgr "creating new pipeline" log, post_install_check.sh)
        // already let operators verify engagement.
        const enableContainer = toBool(C.vars.ENABLE_CONTAINER_HASH_REDUCTION, true);
        const enableSession = toBool(C.vars.ENABLE_SESSION_ID_DETECTION, true);
        const enableHex = toBool(C.vars.ENABLE_HEX_DETECTION, true);
        const enableCustom = toBool(C.vars.ENABLE_CUSTOM_RULES, false);
        const enableAggregation = toBool(C.vars.ENABLE_AGGREGATION, false);
        let highThreshold = Number(C.vars.HIGH_CARDINALITY_THRESHOLD) || 10000;
        let critThreshold = Number(C.vars.CRITICAL_CARDINALITY_THRESHOLD) || 100000;
        // Cat-2.10: defend against negative/NaN/extreme values
        if (!Number.isFinite(highThreshold) || highThreshold < 1) highThreshold = 10000;
        if (!Number.isFinite(critThreshold) || critThreshold < 1) critThreshold = 100000;
        // Cat-2.2 + Loop-2 (v3.18.3): if operator inverts thresholds (CRITICAL <= HIGH),
        // risk classification collapses. Earlier behavior SILENTLY rewrote critThreshold.
        // Better behavior: keep operator values, but surface the misconfig on EVERY event
        // via cr_config_invalid AND don't try to "correct" — let dashboards see the
        // collapse so the operator notices in monitoring instead of in production debugging.
        // The auto-correction was a footgun: operators see X in pack settings but Y is effective.
        const thresholdsInverted = (critThreshold <= highThreshold);
        // (No mutation of critThreshold; the engine will produce the broken risk distribution
        // exactly as configured, but every event carries cr_thresholds_inverted='true' and
        // a new cr_config_invalid='thresholds_inverted' field.)
        const uuidRepl = C.vars.UUID_REPLACEMENT != null ? C.vars.UUID_REPLACEMENT : '__UUID__';
        const sessRepl = C.vars.SESSION_ID_REPLACEMENT != null ? C.vars.SESSION_ID_REPLACEMENT : '__SESSION_ID__';
        const hexRepl = C.vars.HEX_REPLACEMENT != null ? C.vars.HEX_REPLACEMENT : '__HEX__';
        const contRepl = C.vars.CONTAINER_HASH_REPLACEMENT != null ? C.vars.CONTAINER_HASH_REPLACEMENT : '__CONTAINER_HASH__';

        // --- Field Whitelist ---
        // Stores two forms per entry: full lowercased path (preserving dots,
        // for nested-path matches) AND leaf-normalized form (alphanumeric +
        // underscore only, for simple field-name matches). Gets checked in
        // isWhitelisted against both the field's full path and its leaf key.
        const whitelistStr = C.vars.FIELD_WHITELIST || '';
        const WHITELIST = {};
        if (whitelistStr) {
          whitelistStr.split(',').forEach(f => {
            const t = f.trim();
            if (!t) return;
            const lower = t.toLowerCase();
            WHITELIST[lower] = 1;                                        // full form: matches paths
            WHITELIST[lower.replace(/[^a-z0-9_]/g, '')] = 1;             // leaf form: matches plain names
          });
        }

        // --- Sensitive Fields ---
        // Field names whose VALUES should be redacted regardless of their
        // pattern (passwords don't fit any cardinality category but absolutely
        // must not be promoted to indexed top-level fields by the JSON parser).
        const SENSITIVE_FIELDS = {
          password:1, passwd:1, passw:1, pwd:1, secret:1,
          'private_key':1, privatekey:1, ssh_key:1, sshkey:1,
          'client_secret':1, clientsecret:1, 'consumer_secret':1,
          authorization:1, authorisation:1,
          // api_key / auth_token / access_token / refresh_token are also
          // covered by KNOWN_IDS → __SESSION_ID__, so the redaction here
          // is belt-and-suspenders for cases where they're missed.
          'api_key':1, apikey:1, 'auth_token':1, authtoken:1,
          'access_token':1, accesstoken:1, 'refresh_token':1, refreshtoken:1,
          // v3.6.4 additions
          bearer:1, 'bearer_token':1, bearertoken:1,
          'basic_auth':1, basicauth:1, 'auth_header':1, authheader:1,
          credentials:1, credential:1,
          'aws_secret_access_key':1, awssecretaccesskey:1, 'aws_session_token':1,
          'cookie':1, 'set_cookie':1, setcookie:1,  // session cookies leak auth
          totp:1, 'totp_secret':1, otp_secret:1, otpsecret:1,
          'webhook_secret':1, webhooksecret:1, 'signing_secret':1, signingsecret:1,
        };
        // v4.0.0: legitimate *_key field names that are NOT secrets. Without
        // this, sort_key / partition_key / routing_key (ubiquitous in
        // DynamoDB / RabbitMQ / SQL logs) were redacted to __REDACTED__ and
        // routed to the cold tier — a severe false positive. idempotency_key
        // is exempted from REDACTION specifically; its value still flows to
        // Pass-2 where UUID/hex patterns normalize it by shape.
        const KEY_SUFFIX_OK = {
          'sort_key':1, 'partition_key':1, 'routing_key':1, 'cache_key':1,
          'foreign_key':1, 'primary_key':1, 'hash_key':1, 'range_key':1,
          'shard_key':1, 'row_key':1, 'composite_key':1, 'idempotency_key':1,
        };
        // Theme-6 (v3.18.0): allow operators to extend SENSITIVE_FIELDS at deploy
        // time without forking the pack. Comma-separated names; same lowercase +
        // alphanumeric normalization as built-ins.
        const extraSensStr = C.vars.EXTRA_SENSITIVE_FIELDS || '';
        if (extraSensStr) {
          extraSensStr.split(',').forEach(function(name) {
            const t = String(name).trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            if (t) SENSITIVE_FIELDS[t] = 1;
          });
        }

        // --- Field Group Mapping ---
        // Maps field names (case-insensitive) to semantic replacement values.
        // Hardcoded inline — Cribl's code function sandbox forbids fs/require,
        // so external CSV loading isn't possible. To customize, edit this
        // object directly here in the pipeline YAML.
        const FIELD_GROUPS = {
          customer_id: 'customer_entity',
          user_id: 'user_entity',
          account_id: 'account_entity',
          tenant_id: 'tenant_entity',
          org_id: 'org_entity',
          order_id: 'order_ref',
          trace_id: 'request_trace',
          span_id: 'trace_span',
          request_id: 'api_request',
          session_id: 'user_session',
          correlation_id: 'correlation_ref',
          transaction_id: 'txn_ref',
          message_id: 'message_ref',
          container_id: 'container_instance',
          image_id: 'image_ref'
        };

        // Category fallback replacements (used when no field-specific group mapping exists)
        const CATEGORY_DEFAULTS = {
          uuid: uuidRepl, session_id: sessRepl, hex_string: hexRepl,
          container_hash: contRepl, k8s_ephemeral: '', ephemeral_id: '__INSTANCE__',
          custom: '__CUSTOM__', metric_name: '__METRIC__',
          email: '__EMAIL__', jwt: '__JWT__', mac: '__MAC__',
          ipv4: '__IP__', ipv6: '__IP__', mongo_oid: '__OID__',
          stripe_id: '__STRIPE_ID__', aws_arn: '__ARN__',
          iso_ts: '__TS__', unix_ts: '__TS__',
          url_path: '__URL__', generic_id: '__ID__',
          vendor_token: '__TOKEN__'
        };

        // Get the replacement value for a field: field-specific group > category default
        function getRepl(fieldName, category) {
          const kl = fieldName.toLowerCase().replace(/^labels\./, '').replace(/[^a-z0-9_]/g, '');
          if (FIELD_GROUPS[kl]) return FIELD_GROUPS[kl];
          return CATEGORY_DEFAULTS[category] || '__NORMALIZED__';
        }

        // --- Enable Metric Name Normalization ---
        const enableMetricNameNorm = toBool(C.vars.ENABLE_METRIC_NAME_NORMALIZATION, true);
        // --- Splunk Optimization Features ---
        const enableRawMod = toBool(C.vars.ENABLE_RAW_MODIFICATION, true);
        const enableJsonCompact = toBool(C.vars.ENABLE_JSON_COMPACTION, false);
        const enableNullRemoval = toBool(C.vars.ENABLE_NULL_FIELD_REMOVAL, true);
        const enableStackTruncate = toBool(C.vars.ENABLE_STACK_TRACE_TRUNCATION, false);
        // 0 is a valid value (drop ALL frames). Use an explicit-undefined check
        // so the falsy-OR doesn't coerce 0 to the default.
        let stackKeepFrames = (C.vars.STACK_TRACE_KEEP_FRAMES === undefined || C.vars.STACK_TRACE_KEEP_FRAMES === null || C.vars.STACK_TRACE_KEEP_FRAMES === '') ? 5 : +C.vars.STACK_TRACE_KEEP_FRAMES;
        // Cat-2.9: clamp to sensible range — negative or NaN would break truncation logic
        if (!Number.isFinite(stackKeepFrames) || stackKeepFrames < 0) stackKeepFrames = 5;
        if (stackKeepFrames > 100) stackKeepFrames = 100;  // bound on the high side too
        const enableBase64 = toBool(C.vars.ENABLE_BASE64_DETECTION, false);
        const enableFilePathTemplate = toBool(C.vars.ENABLE_FILE_PATH_TEMPLATING, false);
        // (Removed STRIP_CR_METADATA in v3.5.1 — variable was unused since v3.0.0
        // when VERBOSE_AUDIT_METADATA was introduced as the inverted-polarity replacement.)
        const fieldsToDropStr = C.vars.FIELDS_TO_DROP || '';
        const FIELDS_TO_DROP = {};
        if (fieldsToDropStr) {
          fieldsToDropStr.split(',').forEach(f => { const t = f.trim().toLowerCase(); if (t) FIELDS_TO_DROP[t] = 1; });
        }

        // --- Event Type ---
        const isMetric = !!__e._metric;

        // --- Tracking ---
        let matchCount = 0;
        const categories = new Set();
        const modifiedFields = [];
        const droppedFields = [];
        const whitelistedFields = [];
        let estimatedSeriesBefore = 1;
        let sensitiveRedacted = 0;

        // --- Cardinality Multipliers (indicative, not exact) ---
        const MULTIPLIERS = {
          uuid: 50000, session_id: 100000, container_hash: 5000,
          k8s_ephemeral: 500, hex_string: 10000, ephemeral_id: 500,
          custom: 5000, metric_name: 10000,
          email: 100000, jwt: 100000, mac: 50000, mongo_oid: 50000,
          ipv4: 100000, ipv6: 100000, stripe_id: 50000, aws_arn: 5000,
          iso_ts: 86400, unix_ts: 86400, url_path: 5000, generic_id: 10000,
          vendor_token: 100000
        };

        // --- Metric Name Normalization Patterns ---
        // Catches per-entity metric names common in StatsD/Datadog:
        //   api.customer_abc123def.requests → api.requests (entity=customer_abc123def)
        //   app.org_dataday123.memory → app.memory (entity=org_dataday123)
        // Only matches segments that look like entity IDs (contain digits mixed with alpha)
        // and are preceded by a known prefix (customer, tenant, user, org, acct, account)
        const RE_METRIC_ENTITY = /^(.+?)[._]((?:cust|customer|user|acct|account|org|tenant|client)[_-][a-zA-Z0-9_-]{4,})[._](.+)$/i;
        // IP addresses embedded in metric names: server.10_0_1_45.cpu
        const RE_METRIC_IP = /^(.+?)[._](\d{1,3}[_-]\d{1,3}[_-]\d{1,3}[_-]\d{1,3})[._](.+)$/;

        // ============================================================
        // REGEX PATTERNS
        // ============================================================
        const RE_UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        const RE_UUID_BARE = /^[0-9a-f]{32}$/i;
        const RE_UUID_EMBED = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi;
