        const RE_GITLAB_TOKEN = /^glpat-[A-Za-z0-9_-]{20,40}$/;
        // Slack tokens (bot/user/app/refresh)
        const RE_SLACK_TOKEN = /^xox[baprs]-[A-Za-z0-9-]{10,}$/;
        // AWS access keys (AKIA = long-term, ASIA = temp via STS)
        const RE_AWS_ACCESS_KEY = /^(AKIA|ASIA)[A-Z0-9]{16}$/;
        // npm publish token
        const RE_NPM_TOKEN = /^npm_[A-Za-z0-9]{36,40}$/;
        // Google API key
        const RE_GCP_API_KEY = /^AIza[A-Za-z0-9_-]{35,40}$/;
        // Twilio: AC = Account SID, SK = API Key SID
        const RE_TWILIO_SID = /^(AC|SK)[a-f0-9]{32}$/;
        // HTTP Authorization header values: "Bearer xxx", "Basic xxx", "Token xxx"
        const RE_AUTH_HEADER = /^(Bearer|Basic|Token|Digest)\s+\S{6,}$/;
