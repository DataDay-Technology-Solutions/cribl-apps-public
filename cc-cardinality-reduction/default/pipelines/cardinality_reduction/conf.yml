              if (m > estimatedSeriesBefore) estimatedSeriesBefore = m;
            } else if (entityMatch && dryRun) {
              __e.cr_would_normalize_metric = mn + ' → ' + entityMatch[1] + '.' + entityMatch[3];
              matchCount++;
              categories.add('metric_name');
              modifiedFields.push('_metric');
              const m = MULTIPLIERS['metric_name'] || 10000;
              if (m > estimatedSeriesBefore) estimatedSeriesBefore = m;
