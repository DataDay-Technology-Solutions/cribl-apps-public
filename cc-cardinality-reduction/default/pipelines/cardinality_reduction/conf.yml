        const RE_URL_AUTH = /^https?:\/\/[^\/\s:]+:[^\/\s@]+@/;
        // Additional vendor tokens (round-6 expansion):
        // Heroku API keys (UUID-like with HRKU- prefix, or bare UUID; we already catch UUIDs)
        const RE_HEROKU_KEY = /^HRKU-[A-Za-z0-9_-]{30,80}$/;
        // SendGrid API keys: SG.xxxxxxxxxxxxxxxxxxxxxx.xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        const RE_SENDGRID_KEY = /^SG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{30,}$/;
        // Mailgun API keys: key-xxx (32 hex)
        const RE_MAILGUN_KEY = /^key-[a-f0-9]{32}$/;
        // Mailchimp API: 32-char base + datacenter suffix
        const RE_MAILCHIMP_KEY = /^[a-f0-9]{32}-us\d{1,3}$/;
        // Atlassian API tokens: ATATT3xFfGF0... (very long base64ish)
        const RE_ATLASSIAN_TOKEN = /^ATATT3xFfGF0[A-Za-z0-9_-]{60,}$/;
        // Square OAuth tokens
        const RE_SQUARE_TOKEN = /^sq0(atp|csp|idp)-[A-Za-z0-9_-]{20,40}$/;
        // Postman API keys
        const RE_POSTMAN_KEY = /^PMAK-[a-f0-9]{24}-[a-f0-9]{34}$/;
