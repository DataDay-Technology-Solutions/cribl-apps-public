        // ============================================================
        // KNOWN FIELD NAME TABLES
        // ============================================================
        const K8S_DROP = {'pod_template_hash':1,'podtemplatehash':1,'controller_revision_hash':1,'controllerrevisionhash':1,'pod_ip':1,'podip':1,'host_ip':1,'hostip':1,'metrics_path':1,'metricspath':1,'uid':1,'pod_uid':1,'poduid':1};
